# 2GB 内存 Ubuntu 等低内存环境覆盖配置。
# 用法: bash scripts/docker-up-serial.sh
# 或:   docker compose -f docker-compose.yml -f docker-compose.lowmem.yml up -d mysql && sleep ... && ... redis

services:
  mysql:
    mem_limit: 384m
    mem_reservation: 256m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=4M
      - --max-connections=50
      - --table-open-cache=128
      - --thread-cache-size=8
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    mem_limit: 128m
    mem_reservation: 64m
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
