# 2GB 内存 Ubuntu 等低内存环境覆盖配置。
# 用法: bash scripts/docker-up-serial.sh

services:
  mysql:
    mem_limit: 384m
    mem_reservation: 256m
    oom_score_adj: 500
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=4M
      - --max-connections=50
      - --table-open-cache=128
      - --thread-cache-size=8

  redis:
    mem_limit: 128m
    mem_reservation: 64m
    oom_score_adj: 500
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""

  backend:
    mem_limit: 320m
    mem_reservation: 192m
    oom_score_adj: 300

  frontend:
    mem_limit: 48m
    mem_reservation: 32m
    oom_score_adj: 200
